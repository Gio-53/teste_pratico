<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../default.css">
    <link rel="stylesheet" href="cadastro.css">
   <script src="cadastro.js" defer></script>
</head>
<body>
    <div class="header"></div>
    <div id="form-container">
        <form>
            <div class="input-field">
                <span>Nome:</span>
                <input type="text" name="" id="name" placeholder="insira seu nome">
            </div>
            <div class="input-field">
                <span>Email:</span>
                <input type="text" name="" id="email" placeholder="insira seu e-mail">
            </div>
            <div class="input-field">
                <span>Senha:</span>
                <input type="text" name="" id="password" placeholder="insira uma senha com no minímo 6 caractes">
            </div>
            <div class="buttons input-field">
                <button><a href="../principal/index.html">Voltar</a> </button>
                <input type="submit" value="Cadastrar" id="submitBtn">
            </div>
        </form>
   </div>
</body>
</html>
